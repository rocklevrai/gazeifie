<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>gazéifié</title>
<meta name="description" content="A small computer that runs in a browser tab: two interfaces, a window manager, and a shell over an in-memory filesystem.">

<!-- Home-screen install -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="gazéifié">
<meta name="theme-color" content="#16151c">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores SVG here, so this one has to be a real 180×180 PNG. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/phone.css">
</head>

<body>
<!--
  The markup is a skeleton on purpose. Everything with content in it is built
  in JavaScript from data, so the app list, dock, launcher, settings rows and
  window chrome each exist in exactly one place. In the previous version the
  same eight apps were declared once as <section> elements here and again as
  an APPS array in the script, and the two drifted.
-->
<div id="device">
  <div id="wallpaper" aria-hidden="true"></div>

  <header id="menubar" hidden></header>

  <main id="screen">
    <section class="scene on" id="picker" aria-label="Choose an interface"></section>

    <section class="scene" id="boot" aria-label="Starting up" aria-live="polite"></section>

    <!-- Desktop shell -->
    <section class="scene" id="desktop" aria-label="Desktop">
      <div id="desk"></div>
      <div id="deskstat" aria-hidden="true"></div>
      <div id="windows"></div>
      <nav id="dock" aria-label="Dock"></nav>
    </section>

    <!-- Phone shell -->
    <section class="scene" id="phone" aria-label="Phone">
      <div id="launcher">
        <div class="lc-clock" id="lcClock">--:--</div>
        <div class="lc-date" id="lcDate"></div>
        <div class="lc-grid" id="lcGrid"></div>
        <nav class="lc-dock" id="lcDock" aria-label="Dock"></nav>
      </div>

      <div id="stage"></div>

      <div id="recents" aria-label="Recent apps">
        <div class="rc-track"></div>
        <p class="rc-hint">Tap a card to open it. Flick one up to close it.</p>
      </div>

      <div id="cc" aria-label="Control centre">
        <div class="cc-grid" id="ccGrid"></div>
        <div class="cc-slider">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" aria-hidden="true">
            <path d="M12 16.2a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4z M12 2.5v2 M12 19.5v2
                     M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4
                     M18.7 5.3l-1.4 1.4 M6.7 17.3l-1.4 1.4"/>
          </svg>
          <input type="range" id="brightness" min="25" max="100" value="100" aria-label="Brightness">
        </div>
        <div class="cc-handle"></div>
      </div>
    </section>

    <div id="toast"></div>
    <div id="dimmer" aria-hidden="true"></div>
  </main>

  <footer id="navbar" hidden>
    <div id="gesturebar" role="button" tabindex="0"
         aria-label="Home. Swipe up and hold for recent apps."></div>
  </footer>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
